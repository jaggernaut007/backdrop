# Slack app manifest for Backdrop.
#
# Create the app: https://api.slack.com/apps  →  "Create New App"  →  "From a manifest"
# Paste this file, pick the workspace, then:
#   1. Basic Information → App-Level Tokens → "Generate Token and Scopes"
#        name: socket, scope: connections:write   →  copy the xapp-… token  → SLACK_APP_TOKEN
#   2. Install App → "Install to Workspace"       →  copy the xoxb-… Bot User OAuth Token → SLACK_BOT_TOKEN
#   3. Invite the bot to the channel it should watch:  /invite @Backdrop
#        copy the channel ID (channel name → About → bottom) → SLACK_CHANNEL_ID
#   4. The approver's and escalation contact's Slack member IDs (profile → ⋮ → "Copy member ID")
#        → APPROVER_SLACK_USER_ID  /  ESCALATION_SLACK_USER_ID
#
# No signing secret is needed — the app runs in Socket Mode (no public request URL).
#
# ADR 0019 added the `files:write` bot scope (for the batch-completion CSV re-upload,
# `filesUploadV2`). Any scope change requires re-running step 2 ("Install to Workspace"). Note:
# with token_rotation_enabled: false (below), Slack does NOT issue a new Bot User OAuth Token for
# a plain scope-addition reinstall — the existing xoxb-… token just gains the new scope in place.
# Confirm the new scope landed by checking Bot Token Scopes on the OAuth & Permissions page;
# SLACK_BOT_TOKEN does not need to be re-copied unless the token value itself actually changes.

display_information:
  name: Backdrop
  description: Turns spreadsheet shot ideas into approved, published styled product photos.
  background_color: "#2c2f33"

features:
  bot_user:
    display_name: Backdrop
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:history      # read channel history (largely vestigial post-ADR-0019; kept — no
                              #   scope-removal upside now that `files:write` needs a reinstall anyway)
      - channels:read         # resolve channel metadata
      - chat:write            # post reviews, summaries, escalations; edit after a tap
      - files:read            # download a CSV shared in the channel (the ingest entry point)
      - files:write           # ADR 0019: upload the batch-completion CSV (`filesUploadV2`)
      - users:read            # resolve who tapped (binding-actor check)
      - app_mentions:read     # reserved for a future reply-to-post "re-run this SKU" affordance
                              #   (DECISIONS.md A6); no SPEC feature uses it this build
      # private channel? add groups:history + groups:read

settings:
  event_subscriptions:
    bot_events:
      # `message.channels` (blank-row thread replies, F2 `slack-reply`) was dropped in ADR 0019 —
      # once every SKU in a batch shares one thread, Slack's flat threading can't tell which SKU a
      # plain reply is about. Blank-row capture is buttons-only now (`proposal_accept` /
      # `proposal_edit` -> a modal), so no message-content event subscription is needed.
      - file_shared           # a CSV export dropped in the channel
      - app_mention
  interactivity:
    is_enabled: true          # Approve / Reject / reason chips
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
